<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Sandbox</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #1e1e2e;
    --bg-secondary: #181825;
    --bg-surface: #313244;
    --text-primary: #cdd6f4;
    --text-secondary: #a6adc8;
    --text-muted: #6c7086;
    --green: #a6e3a1;
    --green-dim: #4c9a4c;
    --yellow: #f9e2af;
    --yellow-dim: #b89a3a;
    --red: #f38ba8;
    --red-dim: #a84a5a;
    --border: #45475a;
    --accent: #89b4fa;
    --accent-hover: #74c7ec;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    user-select: none;
    flex-shrink: 0;
  }

  .header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green-dim);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .header .dot.connecting {
    background: var(--yellow);
    box-shadow: 0 0 6px var(--yellow-dim);
  }

  .header .dot.disconnected {
    background: var(--red);
    box-shadow: 0 0 6px var(--red-dim);
  }

  .header .title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.3px;
  }

  .header .room-badge {
    margin-left: auto;
    font-size: 11px;
    font-family: var(--font-mono);
    background: var(--bg-surface);
    color: var(--text-secondary);
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Layout ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .panel-header .actions {
    display: flex;
    gap: 6px;
  }

  .panel + .panel {
    border-left: 1px solid var(--border);
  }

  /* ── Editor ── */
  .editor-wrapper {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  #editor {
    width: 100%;
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 16px;
    border: none;
    outline: none;
    resize: none;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }

  #editor::placeholder {
    color: var(--text-muted);
  }

  /* ── Preview ── */
  .preview-wrapper {
    flex: 1;
    background: #fff;
    position: relative;
    min-height: 0;
  }

  #preview {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    font-size: 11px;
    font-family: var(--font-sans);
    font-weight: 500;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1;
  }

  .btn:hover {
    background: #45475a;
    border-color: var(--text-muted);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: var(--accent);
    color: #1e1e2e;
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn-danger {
    color: #f38ba8;
    border-color: #f38ba8;
  }

  .btn-danger:hover {
    background: rgba(243, 139, 168, 0.12);
  }

  /* ── Status ── */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 14px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .status-bar .connected {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-bar .connected .dot-small {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    transition: background 0.3s;
  }

  .status-bar .connected .dot-small.connecting {
    background: var(--yellow);
  }

  .status-bar .connected .dot-small.disconnected {
    background: var(--red);
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <span class="dot" id="headerDot"></span>
    <span class="title">Code Sandbox</span>
    <span class="room-badge" id="roomBadge">—</span>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Editor -->
    <div class="panel">
      <div class="panel-header">
        <span>Editor</span>
        <div class="actions">
          <button class="btn btn-primary" id="runBtn">&#9654; Run</button>
          <button class="btn btn-danger" id="resetBtn">&#8634; Reset</button>
        </div>
      </div>
      <div class="editor-wrapper">
        <textarea id="editor" spellcheck="false" placeholder="Write your HTML/CSS/JS here…"></textarea>
      </div>
    </div>

    <!-- Preview -->
    <div class="panel">
      <div class="panel-header">
        <span>Preview</span>
      </div>
      <div class="preview-wrapper">
        <iframe id="preview" sandbox="allow-scripts allow-modals allow-same-origin" title="Preview"></iframe>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="connected">
      <span class="dot-small" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
    <span id="charCount">0 chars</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  const DEFAULT_CODE = `<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #1e1e2e; color: #cdd6f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    h1 { color: #a6e3a1; }
  </style>
</head>
<body>
  <h1>Hello from Code Sandbox!</h1>
</body>
</html>`;

  const RELAY_SERVER = 'https://oss-collab.excalidraw.com';

  // ── DOM refs (synchronous — always works) ──
  const editor       = document.getElementById('editor');
  const preview      = document.getElementById('preview');
  const runBtn       = document.getElementById('runBtn');
  const resetBtn     = document.getElementById('resetBtn');
  const roomBadge    = document.getElementById('roomBadge');
  const statusText   = document.getElementById('statusText');
  const charCount    = document.getElementById('charCount');
  const headerDot    = document.getElementById('headerDot');
  const statusDot    = document.getElementById('statusDot');

  let debounceTimer     = null;
  let isExternalUpdate  = false;
  let socket            = null;
  let roomKey           = null;

  // ── Connection state ──

  /** Set connection indicator to a state: 'connected', 'connecting', or 'disconnected' */
  function setConnectionState(state) {
    headerDot.className = 'dot';
    statusDot.className = 'dot-small';
    if (state === 'connected') {
      headerDot.classList.remove('connecting', 'disconnected');
      statusDot.classList.remove('connecting', 'disconnected');
      statusText.textContent = 'Connected';
    } else if (state === 'connecting') {
      headerDot.classList.add('connecting');
      statusDot.classList.add('connecting');
      statusText.textContent = 'Connecting\u2026';
    } else {
      headerDot.classList.add('disconnected');
      statusDot.classList.add('disconnected');
      statusText.textContent = 'Disconnected';
    }
  }

  // ── Room ID from URL hash ──

  function parseRoomHash() {
    const match = location.hash.match(/room=([^,]+),([^&]+)/);
    if (match) return { roomId: match[1], roomKey: match[2] };
    // Also try without key (fallback)
    const matchNoKey = location.hash.match(/room=([^,&]+)/);
    if (matchNoKey) return { roomId: matchNoKey[1], roomKey: null };
    return null;
  }

  const roomInfo = parseRoomHash();

  // ── Crypto helpers (AES-GCM 128-bit via Web Crypto API) ──

  async function importRoomKey(keyStr) {
    return crypto.subtle.importKey(
      'jwk',
      { alg: 'A128GCM', ext: true, k: keyStr, key_ops: ['encrypt', 'decrypt'], kty: 'oct' },
      { name: 'AES-GCM', length: 128 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function encryptData(keyStr, data) {
    const key = await importRoomKey(keyStr);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encryptedBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    return { encryptedBuffer, iv };
  }

  async function decryptData(keyStr, iv, data) {
    const key = await importRoomKey(keyStr);
    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new Uint8Array(decrypted);
  }

  // ── Send code via available channel ──

  async function sendCode(code) {
    if (window.opener) {
      // Popup mode: send via postMessage
      window.opener.postMessage({ type: 'CODE_FROM_SANDBOX', code: code }, '*');
    } else if (socket && socket.connected && roomKey) {
      // Standalone mode: send via socket
      try {
        const payload = {
          type: 'CODE_UPDATE',
          payload: {
            code: code,
            socketId: 'sandbox-connection',
            username: 'Sandbox'
          }
        };
        const encoded = new TextEncoder().encode(JSON.stringify(payload));
        const { encryptedBuffer, iv } = await encryptData(roomKey, encoded);
        socket.emit('server', roomInfo.roomId, encryptedBuffer, iv);
      } catch (err) {
        console.error('Failed to encrypt/send code:', err);
      }
    }
  }

  // ── Update preview ──
  function updatePreview() {
    const code = editor.value;
    preview.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(code);
  }

  function debouncedUpdatePreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updatePreview, 500);
  }

  // ── Update char count ──
  function updateCharCount() {
    const len = editor.value.length;
    charCount.textContent = len.toLocaleString() + ' chars';
  }

  // ── PostMessage: tell parent we're ready ──
  if (window.opener) {
    window.opener.postMessage({ type: 'CODE_SANDBOX_READY' }, '*');
    statusText.textContent = 'Connected to Excalidraw';
    setConnectionState('connected');
    if (roomInfo) {
      roomBadge.textContent = 'room: ' + roomInfo.roomId;
    }
  }

  // ── Listen for code updates from collab (postMessage) ──
  window.addEventListener('message', function onMessage(event) {
    if (event.data?.type === 'CODE_UPDATE') {
      isExternalUpdate = true;
      editor.value = event.data.code;
      updatePreview();
      updateCharCount();
      isExternalUpdate = false;
    }
  });

  // ── When user types, send code ──
  editor.addEventListener('input', function onInput() {
    if (isExternalUpdate) return;
    sendCode(editor.value);
    debouncedUpdatePreview();
    updateCharCount();
  });

  // ── Keyboard shortcuts ──
  editor.addEventListener('keydown', function onKeydown(e) {
    // Tab in textarea inserts 2 spaces (instead of moving focus)
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end   = this.selectionEnd;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
      this.dispatchEvent(new Event('input'));
    }
    // Ctrl+Enter / Cmd+Enter to run
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      updatePreview();
    }
  });

  // ── Buttons ──
  runBtn.addEventListener('click', updatePreview);

  resetBtn.addEventListener('click', function onReset() {
    editor.value = DEFAULT_CODE;
    updatePreview();
    updateCharCount();
    sendCode(DEFAULT_CODE);
  });

  // ── Init (synchronous — page renders immediately) ──
  editor.value = DEFAULT_CODE;
  updatePreview();
  updateCharCount();

  // ── Determine mode ──
  if (!window.opener && roomInfo && roomInfo.roomId && roomInfo.roomKey) {
    // Standalone mode: connect directly to relay
    roomKey = roomInfo.roomKey;
    roomBadge.textContent = 'room: ' + roomInfo.roomId;
    statusText.textContent = 'Connecting to relay\u2026';
    setConnectionState('connecting');
  } else if (!window.opener && roomInfo && roomInfo.roomId && !roomInfo.roomKey) {
    // URL has room but no key — show badge but don't connect
    roomBadge.textContent = 'room: ' + roomInfo.roomId + ' (no key)';
  } else if (!window.opener) {
    // Local mode: no opener, no room — just a local editor
    statusText.textContent = 'Local mode';
    setConnectionState('disconnected');
  }

  // ── Socket connection (async — waits for io to be available) ──

  function connectSocket() {
    const roomId = roomInfo.roomId;
    const roomKeyStr = roomInfo.roomKey;
    if (!roomId || !roomKeyStr) {
      console.warn('No room info available, cannot connect socket');
      return;
    }

    const url = RELAY_SERVER;
    statusText.textContent = 'Connecting to relay\u2026';
    setConnectionState('connecting');

    socket = io(url, {
      transports: ['websocket', 'polling'],
    });

    socket.on('connect', () => {
      setConnectionState('connected');
      statusText.textContent = 'Connected \u2014 joined room';
      socket.emit('join-room', roomId, roomKeyStr);
    });

    socket.on('disconnect', (reason) => {
      setConnectionState('disconnected');
      statusText.textContent = 'Disconnected: ' + reason;
    });

    socket.on('connect_error', (err) => {
      setConnectionState('disconnected');
      statusText.textContent = 'Connection error: ' + err.message;
    });

    // Receive encrypted broadcasts from other clients
    socket.on('client-broadcast', async (encryptedData, iv) => {
      try {
        const decrypted = await decryptData(roomKeyStr, new Uint8Array(iv), encryptedData);
        const data = JSON.parse(new TextDecoder().decode(decrypted));
        if (data.type === 'CODE_UPDATE') {
          isExternalUpdate = true;
          editor.value = data.payload.code;
          updatePreview();
          updateCharCount();
          isExternalUpdate = false;
        }
      } catch (err) {
        console.error('Failed to decrypt/parse broadcast:', err);
      }
    });

    // Update badge
    roomBadge.textContent = 'room: ' + roomId;
  }

  // ── Try to connect socket (async, retries if io not ready yet) ──
  function tryConnect() {
    if (typeof io !== 'undefined') {
      // io is available — connect now
      connectSocket();
      return;
    }
    // io not loaded yet — retry in 500ms
    setTimeout(tryConnect, 500);
  }

  // Determine if we should try connecting
  if (!window.opener && roomInfo && roomInfo.roomId && roomInfo.roomKey) {
    // Add dynamic script injection as a fallback in case defer tag failed
    if (typeof io === 'undefined') {
      const script = document.createElement('script');
      script.src = 'https://cdn.socket.io/4.7.2/socket.io.min.js';
      script.onload = tryConnect;
      document.head.appendChild(script);
    }
    // Try connecting immediately (or wait for io to load via defer)
    tryConnect();
  }

})();
</script>
</body>
</html>
