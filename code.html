<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#121212;color:#eee;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:#1e1e1e;padding:6px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #333;flex-shrink:0}
.toolbar .logo{font-weight:700;font-size:14px;color:#ff6b6b}
.toolbar .sep{width:1px;height:20px;background:#333}
.toolbar button{background:#333;border:none;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.toolbar button:hover{background:#444;color:#fff}
.toolbar button.run{background:#2ea043;color:#fff}
.toolbar button.run:hover{background:#3fb950}
.toolbar button.clear{background:#da3633;color:#fff}
.toolbar .spacer{flex:1}
.split{flex:1;display:flex;overflow:hidden;min-height:0}
@media(max-width:768px){.split{flex-direction:column}}
.editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid #333;min-width:0}
@media(max-width:768px){.editor-pane{border-right:none;border-bottom:1px solid #333;height:50%}}
.editor-wrap{flex:1;display:flex;position:relative;overflow:hidden;min-height:0;background:#1e1e1e}
.gutter{width:40px;background:#1e1e1e;color:#555;text-align:right;padding:8px 4px;font-family:'Courier New',monospace;font-size:13px;line-height:1.5;overflow:hidden;user-select:none;flex-shrink:0;border-right:1px solid #2a2a2a}
.gutter div{padding-right:6px}
textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:#d4d4d4;font-family:'Courier New',monospace;font-size:13px;line-height:1.5;padding:8px 10px;tab-size:2;white-space:pre;overflow:auto}
.preview-pane{flex:1;display:flex;flex-direction:column;background:#fff}
.preview-pane iframe{flex:1;width:100%;border:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>
<div class="toolbar">
  <div class="logo">&lt;/&gt; Playground</div>
  <div class="sep"></div>
  <button class="run" onclick="runCode()">▶ Run</button>
  <button onclick="autoRun=!autoRun;this.style.background=autoRun?'#2ea043':'#333';this.textContent=autoRun?'Auto:ON':'Auto:OFF'">Auto:ON</button>
  <div class="spacer"></div>
  <button onclick="resetCode()">↺ Reset</button>
  <button class="clear" onclick="clearCode()">✕ Clear</button>
</div>
<div class="split">
  <div class="editor-pane">
    <div class="editor-wrap">
      <div class="gutter" id="gutter"><div>1</div></div>
      <textarea id="editor" spellcheck="false" placeholder="Write HTML/CSS/JS..." oninput="onEdit()" onkeydown="onKey(event)"></textarea>
    </div>
  </div>
  <div class="preview-pane">
    <iframe id="preview" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
  </div>
</div>
<script>
const DEFAULT = '<!DOCTYPE html>\n<html>\n<head>\n  <title>Hello</title>\n  <style>\n    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }\n    h1 { color: #333; }\n  </style>\n</head>\n<body>\n  <h1>Hello!</h1>\n  <p>Edit the code and click Run.</p>\n</body>\n</html>';
const ed = document.getElementById('editor');
const g = document.getElementById('gutter');
const ifr = document.getElementById('preview');
let autoRun = true, timer = null;

function updateGutter() {
  const n = (ed.value.match(/\n/g)||[]).length + 1;
  let h = '';
  for (let i = 1; i <= n; i++) h += '<div>'+i+'</div>';
  g.innerHTML = h;
}

function runCode() {
  const d = ifr.contentDocument || ifr.contentWindow.document;
  d.open(); d.write(ed.value); d.close();
}

function onEdit() {
  updateGutter();
  if (autoRun) {
    clearTimeout(timer);
    timer = setTimeout(runCode, 400);
  }
}

function onKey(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = ed.selectionStart, en = ed.selectionEnd;
    ed.value = ed.value.substring(0,s) + '  ' + ed.value.substring(en);
    ed.selectionStart = ed.selectionEnd = s + 2;
    onEdit();
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    runCode();
  }
}

function clearCode() { ed.value = ''; updateGutter(); runCode(); }
function resetCode() { ed.value = DEFAULT; updateGutter(); runCode(); }

ed.value = DEFAULT;
updateGutter();
runCode();
</script>
</body>
</html>
